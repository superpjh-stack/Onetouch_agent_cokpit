# Run from the repository root with the original Compose file first.
# Preserve its PostgreSQL service, volume, project name and host port.
services:
  app:
    build:
      context: .
      dockerfile: v2/Dockerfile
      args:
        VITE_BASE_PATH: /onetouch/
    environment:
      COCKPIT_ACCESS_TOKEN: ${COCKPIT_ACCESS_TOKEN:-}
      OPENAI_REALTIME_MODEL: ${OPENAI_REALTIME_MODEL:-gpt-realtime-2.1}
      OPENAI_REALTIME_VOICE: ${OPENAI_REALTIME_VOICE:-marin}
    networks:
      - default
      - rodem_https

networks:
  rodem_https:
    external: true
    name: rodem-mes_mesnet
