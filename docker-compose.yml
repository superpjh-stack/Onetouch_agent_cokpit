services:
  postgres:
    image: pgvector/pgvector:pg17
    environment:
      POSTGRES_DB: onetouch
      POSTGRES_USER: onetouch
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD를 설정하세요}
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U onetouch -d onetouch"]
      interval: 5s
      timeout: 5s
      retries: 12
    volumes:
      - onetouch_pgdata:/var/lib/postgresql/data

  app:
    build: .
    ports:
      - "8507:8501"
    environment:
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
      OPENAI_MODEL: ${OPENAI_MODEL:-gpt-5.6}
      DATABASE_URL: postgresql://onetouch:${POSTGRES_PASSWORD}@postgres:5432/onetouch
    depends_on:
      postgres:
        condition: service_healthy
    restart: unless-stopped

volumes:
  onetouch_pgdata:
